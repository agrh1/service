global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api_gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['api_gateway:8003']

  - job_name: 'django'
    metrics_path: /metrics/
    static_configs:
      - targets: ['django:8000']

  - job_name: 'seafile'
    metrics_path: /metrics
    static_configs:
      - targets: ['seafile:8002']

  - job_name: 'intraservice'
    metrics_path: /metrics
    static_configs:
      - targets: ['intraservice:8001']

  - job_name: 'telegram_bot'
    metrics_path: /metrics
    static_configs:
      - targets: ['telegram:9102']

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'celery_exporter'
    static_configs:
      - targets: ['celery_exporter:9808']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
