version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_service
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices_network

  redis:
    image: redis:7-alpine
    container_name: redis_service
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices_network

  django:
    build:
      context: ./django_portal
      dockerfile: Dockerfile
    container_name: django_portal_service
    image: ${REGISTRY:-local}/${IMAGE_PREFIX:-service}-django:dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_URL: postgresql://microservices:microservices@postgres:5432/microservices_db
      DEBUG: "False"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - microservices_network

  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: api_gateway_service
    image: ${REGISTRY:-local}/${IMAGE_PREFIX:-service}-api_gateway:dev
    env_file: .env
    environment:
      INTRASERVICE_URL: http://intraservice:8001
      SEAFILE_SERVICE_URL: http://seafile:8002
      DJANGO_URL: http://django:8000
    ports:
      - "8003:8003"
    depends_on:
      intraservice:
        condition: service_started
      seafile:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - microservices_network

  intraservice:
    build:
      context: ./intraservice_service
      dockerfile: Dockerfile
    container_name: intraservice_service
    image: ${REGISTRY:-local}/${IMAGE_PREFIX:-service}-intraservice:dev
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    command: uvicorn api:app --host 0.0.0.0 --port 8001
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - microservices_network

  intraservice_worker:
    image: ${REGISTRY:-local}/${IMAGE_PREFIX:-service}-intraservice:dev
    container_name: intraservice_worker
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    command: celery -A tasks worker --loglevel=info
    depends_on:
      redis:
        condition: service_started
    networks:
      - microservices_network

  celery_beat:
    image: ${REGISTRY:-local}/${IMAGE_PREFIX:-service}-intraservice:dev
    container_name: intraservice_beat
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    command: celery -A tasks beat --loglevel=info
    depends_on:
      redis:
        condition: service_started
    networks:
      - microservices_network

  seafile:
    build:
      context: ./seafile_service
      dockerfile: Dockerfile
    container_name: seafile_service
    image: ${REGISTRY:-local}/${IMAGE_PREFIX:-service}-seafile:dev
    env_file: .env
    environment:
      SEAFILE_URL: ${SEAFILE_URL}
      SEAFILE_USERNAME: ${SEAFILE_USERNAME}
      SEAFILE_PASSWORD: ${SEAFILE_PASSWORD}
      SEAFILE_LIBRARY_ID: ${SEAFILE_LIBRARY_ID}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - microservices_network

  telegram:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: telegram_bot_service
    image: ${REGISTRY:-local}/${IMAGE_PREFIX:-service}-telegram:dev
    env_file: .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      METRICS_PORT: ${METRICS_PORT:-9102}
    ports:
      - "9102:9102"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9102/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - microservices_network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_reverse_proxy
    depends_on:
      django:
        condition: service_started
      api_gateway:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - microservices_network

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-15}d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - microservices_network

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - microservices_network

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    ports:
      - "9100:9100"
    networks:
      - microservices_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - microservices_network

  redis_exporter:
    image: oliver006/redis_exporter:v1.54.0
    container_name: redis_exporter
    command: ["--redis.addr=redis:6379"]
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_started
    networks:
      - microservices_network

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: postgres_exporter
    env_file: .env
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices_network

  celery_exporter:
    image: danihodovic/celery-exporter:1.10.0
    container_name: celery_exporter
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    ports:
      - "9808:9808"
    depends_on:
      redis:
        condition: service_started
      intraservice:
        condition: service_started
    networks:
      - microservices_network

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx_exporter
    command:
      - "-nginx.scrape-uri=http://nginx:8080/stub_status"
    ports:
      - "9113:9113"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - microservices_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backups:
  static_volume:
  media_volume:

networks:
  microservices_network:
    driver: bridge
